services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000" # Ensures Prometheus runs as a non-root user for security
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # Added: Allows live-reloading configs via HTTP POST
      - '--web.enable-lifecycle' 
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      # Added: Maps alerting rules
      - ./prometheus/rules:/etc/prometheus/rules:ro 
      - ./prometheus/data:/prometheus
      # Mount the host's timezone and localtime
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-net

  alertmanager-init:
    image: alpine:latest
    container_name: alertmanager-init
    env_file: .env
    volumes:
      # Mount the template file (Read-Only)
      - ./alertmanager/alertmanager.yml.tmpl:/tmp/alertmanager.yml.tmpl:ro
      # Mount an output directory to store the processed file
      - ./alertmanager/config:/etc/alertmanager
    command: >
      sh -c "apk add --no-cache gettext && 
      envsubst < /tmp/alertmanager.yml.tmpl > /etc/alertmanager/alertmanager.yml"

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    container_name: alertmanager
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      alertmanager-init:
        condition: service_completed_successfully
    volumes:
      # Read the processed config file from the shared directory
      - ./alertmanager/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/data:/alertmanager
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      # Added: Auto-loads dashboards/datasources
      - ./grafana/provisioning:/etc/grafana/provisioning:ro 
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - monitoring-net

# This is for collecting the hardware and OS metrics (CPU, RAM, Disk) of the specific machine running this MAIN Docker stack.
# Note: To monitor your other VMs and CTs, install Node Exporter directly on their native OS. Do not duplicate this container for remote hosts.
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    user: "1000:1000"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

# This should be here because it acts as a central network prober.
# It pings and checks HTTP endpoints across the entire environment, so is only need this single instance sitting right next to Prometheus.
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: blackbox-exporter
    restart: unless-stopped
    cap_add:             # THIS Allows the container to send ICMP Pings
      - NET_RAW
    volumes:
      - ./prometheus/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge