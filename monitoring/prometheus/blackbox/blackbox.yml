#---------------------------------------------------------------------------
# Blackbox Exporter Configuration
#---------------------------------------------------------------------------

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []   # any 2xx
      method: GET
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp_ping:
    prober: icmp
    timeout: 5s